<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">

  <title>YouTube Player</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #000;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #player {
      width: 100%;
      height: 100%;
    }
  </style>
</head>

<body>

  <div id="player"></div>

  <script>
    const params =
      new URLSearchParams(
        window.location.search
      );

    const videoId =
      params.get("video");

    const start =
      Math.max(
        0,
        Number(params.get("start")) || 0
      );

    if (videoId) {

      const iframe =
        document.createElement("iframe");

      iframe.src =
        "https://www.youtube.com/embed/" +
        encodeURIComponent(videoId) +
        "?autoplay=1" +
        "&start=" +
        start +
        "&rel=0" +
        "&playsinline=1";

      iframe.style.width =
        "100%";

      iframe.style.height =
        "100%";

      iframe.style.border =
        "0";

      iframe.setAttribute(
        "allow",
        "autoplay; encrypted-media; picture-in-picture"
      );

      iframe.setAttribute(
        "allowfullscreen",
        ""
      );

      iframe.setAttribute(
        "referrerpolicy",
        "strict-origin-when-cross-origin"
      );

      document
        .getElementById("player")
        .appendChild(iframe);

    } else {

      document.body.innerHTML =
        "<p style='color:white;padding:20px'>" +
        "No YouTube video selected." +
        "</p>";

    }
  </script>

</body>
</html>
